<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My profile — TaskLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">T</span><span>Task<span class="brand-blue">Link</span></span></a><button class="menu-toggle" aria-label="Toggle navigation" data-menu-toggle>☰</button><nav class="main-nav" data-main-nav><a href="index.html">Home</a><a href="browse.html">Find work</a><a href="index.html#services">Categories</a></nav><div class="nav-actions"><a class="nav-login" href="dashboard.html">Dashboard</a><a class="btn btn-primary btn-small" href="post-task.html">Post a task</a></div></div></header><main class="page-main"><div class="container narrow-container"><div class="page-heading"><div><h1>My <span class="text-blue">profile.</span></h1><p>What clients and providers see when they look you up.</p></div></div><div class="profile-card"><div class="profile-cover"></div><div class="profile-main"><div class="profile-avatar" id="profile-avatar">TL</div><div class="profile-head"><div><h2 id="profile-display-name">TaskLink Member</h2><p id="profile-display-role">Community member · Botswana</p></div><span class="profile-badge">Demo profile</span></div><form id="profile-form" class="profile-form"><label class="field-label" for="profile-name">Full name</label><input class="form-control" id="profile-name" name="name" placeholder="Your name" required><label class="field-label" for="profile-role">I am here as</label><select class="form-control" id="profile-role" name="role"><option value="Both a client and provider">Both a client and provider</option><option value="A client">A client</option><option value="A service provider">A service provider</option><option value="A business">A business</option></select><label class="field-label" for="profile-location">Location</label><select class="form-control" id="profile-location" name="location"><option>Gaborone</option><option>Francistown</option><option>Maun</option><option>Palapye</option><option>Other Botswana</option></select><label class="field-label" for="profile-bio">About me</label><textarea class="form-control" id="profile-bio" name="bio" rows="4" placeholder="Tell people a little about your experience, skills or what kind of help you need."></textarea><label class="field-label" for="profile-skills">Skills or services (optional)</label><input class="form-control" id="profile-skills" name="skills" placeholder="e.g. cleaning, graphic design, tutoring"><button class="btn btn-primary btn-large" type="submit">Save profile</button><p class="form-terms">Profile information is stored locally in this browser for this prototype.</p></form></div></div></div></main><footer class="site-footer"><div class="container footer-bottom"><span>© <span data-year></span> TaskLink. Prototype build.</span><a href="index.html">Home</a></div></footer></body></html>
